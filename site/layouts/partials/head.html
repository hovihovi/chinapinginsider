<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }} | {{ i18n "tagline" }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Params.dek }}{{ . }}{{ else }}{{ i18n "homeDescription" }}{{ end }}">
  <meta name="theme-color" content="#0A2540">
  <link rel="icon" type="image/svg+xml" href="{{ "img/design/logo.svg" | relURL }}">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  <link rel="alternate" type="application/rss+xml" href="{{ "index.xml" | absURL }}" title="{{ .Site.Title }}">
  {{ range .Translations }}
  <link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Permalink }}">
  {{ end }}
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:image" content="{{ (.Params.image | default .Site.Params.penguin) | absURL }}">
  <meta name="twitter:card" content="summary_large_image">
</head>
